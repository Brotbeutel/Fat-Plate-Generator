# Fat Plate Generator - example configuration (TOML)
#
# Use it with:   python .\fat_plate_generator.py --config .\fat_plate_config.example.toml
#
# Every key is optional. A key that is missing keeps its built-in default; this
# file lists all keys with exactly those defaults, so it changes nothing.
# Precedence: command line option > this file > built-in default.
# The layout and the output file (--json, --output) are not set here: the same
# config is meant to serve different layouts.
# Relative paths in this file are relative to the folder of this file.
# Unknown keys, values of the wrong type and missing template files are errors.

# Margin around the keys in mm (CLI: --margin).
margin = 1.0

# Keys with a width or height of at least this many units get a stabilizer cutout
# (CLI: --stabilizer-min-unit). Use 1.75 to give 1.75u keys a stabilizer as well.
stabilizer_min_unit = 2.0

# true: the plate is one connected mesh without gaps (CLI: --single-mesh,
# --no-single-mesh).
single_mesh = false

# true: the top row of the layout (for a 100% layout Esc, F1-F12, PrtSc, Scroll Lock
# and Pause Break) becomes one connected strip of plate. Only that row is joined,
# not the main block. It has no effect together with single_mesh = true
# (CLI: --fuse-f-row, --no-fuse-f-row).
fuse_f_row = false

# Switch position of the spacebar, seen from above with the typist at the bottom:
# "centered", "off-centered-left" or "off-centered-right" (CLI: --spacebar-position).
spacebar_position = "centered"

# Socket of a stepped key (KLE "l": true), for example a stepped Caps Lock:
# "standard" (normal socket at the center of w) or "wide-caps" (wide-caps socket
# at the center of w2) (CLI: --stepped-key).
stepped_key = "standard"

[orientation]
# ADDITIONAL rotation of the cutouts in degrees (an offset), counter-clockwise seen
# from above, around the switch center, on top of the built-in base orientation.
# 0 keeps the base orientation. Allowed: 0, 90, 180, 270 (CLI: --stab-rotation-horizontal,
# --stab-rotation-vertical, --stab-rotation-spacebar, --wide-caps-rotation).
stab_rotation_horizontal = 0
stab_rotation_vertical = 0
stab_rotation_spacebar = 0
wide_caps_rotation = 0

# Whole-plate transform: false skips it completely, including the built-in KLE y flip
# (CLI: --global-transform, --no-global-transform).
global_transform = true

# ADDITIONAL rotation of the finished plate in degrees (0, 90, 180, 270): outline,
# switch centers and cutouts turn together. global_mirror_x additionally mirrors the
# outline and the switch positions along X; the cutouts are never mirrored. The KLE y
# flip is built in: the plate is the layout seen from above, the typist side at low Y
# (CLI: --global-rotation, --global-mirror-x, --no-global-mirror-x).
global_rotation = 0
global_mirror_x = false

[templates]
# Spacebar templates are configurable here; spacebar_*_off_centered is the right
# template and spacebar_position = "off-centered-left" uses it mirrored.
socket = "stl-templates/switch_socket.stl"
wide_caps = "stl-templates/switch_socket_wide-caps.stl"
stabilizer_2u = "stl-templates/stabilizer_2-00u.stl"
stabilizer_3u = "stl-templates/stabilizer_3-00u.stl"
spacebar_6u_centered = "stl-templates/stabilizer_6-00u_centered.stl"
spacebar_6u_off_centered = "stl-templates/stabilizer_6-00u_off-center.stl"
spacebar_6_25u_centered = "stl-templates/stabilizer_6-25u_centered.stl"
spacebar_6_25u_off_centered = "stl-templates/stabilizer_6-25u_off-center.stl"
spacebar_7u_centered = "stl-templates/stabilizer_7-00u_centered.stl"
